name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # release.yml runs every check on the tagged commit before publishing
  # the browser check's every width (BROWSER_CHECK_FULL=1, #1029): nightly on main and on demand, as on a release; a
  # pull request or a push to main checks a fixed sample of each size sweep's widths
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which jobs this pull request's changes can affect (.github/scripts/changes.py). A push to main, a release
  # (workflow_call) or a change to CI runs everything. A job skipped here counts as passed for branch protection.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.c.outputs.app }}
      image: ${{ steps.c.outputs.image }}
      templates: ${{ steps.c.outputs.templates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2   # a pull request's merge commit and its base: the files the pull request changes
      - id: c
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD | tee /dev/stderr | python3 -I .github/scripts/changes.py >> "$GITHUB_OUTPUT"
          else
            python3 -I .github/scripts/changes.py --all < /dev/null >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CHANGELOG.md is in the format the release workflow reads
        run: python -I .github/scripts/changelog.py check

  tests:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30   # about 13 minutes (#1029: the browser check, 63 more, is the browser job's now)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python files compile
        run: python -m py_compile build.py docker/setup.py demo/generate.py watch/receiver.py tests/browser_check.py tests/test_api.py tests/test_first_run.py tests/test_uploads.py tests/test_jobs.py tests/test_manual.py tests/test_preview.py tests/test_import_history.py tests/test_edits.py tests/test_recategorize.py tests/test_crossmatch.py tests/test_journal.py tests/test_milestones.py tests/test_lab_mapping.py tests/test_watch_store.py tests/docker_smoke.py tests/test_importer*.py server/*.py server/importers/*.py server/importers/pdf_layouts/*.py tests/test_fakefhir.py tests/test_connections.py tests/fakefhir/*.py tests/test_settings.py tests/test_shl.py tests/shl_server.py tests/test_outside.py tests/netguard.py tests/whole_records.py tests/test_calendar.py tests/test_summary.py tests/test_share_links.py tests/test_security_refresh.py tests/test_host_check.py tests/test_general_host.py docker/allinone.py deploy/check.py .github/scripts/changelog.py tests/test_directory.py server/directory/*.py tools/build_directory.py tests/test_pwa.py tests/test_units.py tests/test_ranges.py tests/ranges_matrix.py tools/make_icons.py tools/make_wordmark.py tools/make_social_preview.py tools/site_screenshots.py tools/screenshots.py .github/scripts/changes.py tests/test_ci_changes.py tests/test_medications.py tests/test_costs.py tests/test_backups.py tests/test_performance.py tools/anonymise.py tests/test_anonymise.py tests/test_glucose.py tests/test_person.py tests/test_receiver_vitals.py tests/test_cycle.py tests/test_ecg.py tests/test_receiver_activity.py tests/test_growth.py tools/growth_tables.py tests/test_fhir_export.py tests/fhir_schema_check.py tools/fhir_schema_subset.py tests/test_med_log.py tests/test_export.py tests/test_condition_presets.py tests/test_lab_test_pages.py tests/test_css_tokens.py tests/test_palette.py tests/test_qr.py tests/test_ids.py tests/test_family.py

      - name: Which jobs a pull request runs (docs only, templates only, tests only, CI itself)
        run: python tests/test_ci_changes.py

      - name: Shell scripts parse
        run: bash -n docker/dev-stack.sh

      - name: "Styles from the tokens (#252): no more raw colours, px font sizes, radii, shadows or script-set styles than allowed"
        run: python tests/test_css_tokens.py

      - name: "The kinds of record's colours (#301): eight at most, through the palette checks in light and dark"
        run: python tests/test_palette.py

      - name: "QR codes (#284): our own encoder against published vectors and an independent encoder's symbols, every length read back (node, as the runner has it)"
        run: python tests/test_qr.py

      - name: JSON templates parse
        run: for f in *.example.json lab-aliases.json condition-presets.json lab-test-pages.json; do python -m json.tool "$f" > /dev/null || exit 1; done


      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.8"

      # Each lock must be what `uv pip compile` makes from its .in file with the options in requirements.in,
      # keeping the pins it already has: every package of the .in, with hashes and platform markers. Comments
      # are left out of the comparison, so a different uv version's annotations don't matter.
      - name: Lock files match requirements.in (also checks Dependabot's regenerated locks)
        run: |
          mkdir -p /tmp/locks
          for lock in requirements.txt requirements-dev.txt; do
            head -2 "$lock" | grep -q "uv pip compile --universal --python-version 3.12 --generate-hashes ${lock%.txt}.in -o $lock" \
              || { echo "$lock: header isn't the uv command from requirements.in"; exit 1; }
            cp "$lock" "/tmp/locks/$lock"
            uv pip compile --quiet --universal --python-version 3.12 --generate-hashes "${lock%.txt}.in" -o "/tmp/locks/$lock"
            diff <(grep -v '^ *#' "$lock") <(grep -v '^ *#' "/tmp/locks/$lock") \
              || { echo "$lock doesn't match ${lock%.txt}.in: regenerate it as requirements.in says"; exit 1; }
          done

      - name: compose.yaml and compose.release.yaml are valid
        run: |
          docker compose config --quiet
          docker compose -f compose.release.yaml config --quiet

      - name: Demo data is deterministic
        run: |
          python -I demo/generate.py /tmp/demo --end 2026-11-15
          sha256sum /tmp/demo/data.json > /tmp/first
          python -I demo/generate.py /tmp/demo --end 2026-11-15
          sha256sum -c /tmp/first
          python -I demo/generate.py /tmp/big --end 2026-11-15 --big   # the performance budgets' fixture (#201)
          sha256sum /tmp/big/data.json /tmp/big/files/big/doc-1000.pdf > /tmp/first-big
          python -I demo/generate.py /tmp/big --end 2026-11-15 --big
          sha256sum -c /tmp/first-big

      - name: Install dependencies, Playwright and Chromium
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: "The browser job's parts are tests/browser_check.py's, in its order (#1029: a part left out would never run here)"
        run: |
          want=$(python tests/browser_check.py --parts | paste -sd, -)
          got=$(grep -oP '^ +part: \[\K[^]]*' .github/workflows/check.yml | tr -d ' ')
          test "$want" = "$got" || { echo "check.yml's browser matrix is [$got]; browser_check.py's PARTS are $want"; exit 1; }

      - name: API tests (sign-in, sessions, roles, sharing, documents)
        run: python tests/test_api.py

      - name: "A fresh install starts empty; the demo is a profile of its own, added on request and removed whole (#1101)"
        run: python tests/test_first_run.py

      - name: Backups in Admin (Back up now in the background, the schedule, pruning only its own files, late warning, restore check on good and damaged backups, live data untouched, permissions)
        run: python tests/test_backups.py

      - name: Upload tests (who may upload, refused paths and zips, limits, encryption, export, cleanup)
        run: python tests/test_uploads.py

      - name: Background imports (format detection, nothing left by a failed import, roles, interrupted jobs)
        run: python tests/test_jobs.py

      - name: Import preview (re-uploads are all duplicates, overlaps add only what's new, cancel, roles, stable keys)
        run: python tests/test_preview.py

      - name: Lab results typed in (read as a CSV's rows, same keys, bad rows refused, roles)
        run: python tests/test_manual.py

      - name: Imported watch data (stored per profile, merged with the receiver's, replaced by identity, export)
        run: python tests/test_watch_store.py

      - name: iPhone sync through Health Auto Export (same summary as an export, bearer secret, duplicates dropped)
        run: python tests/test_receiver_hae.py

      - name: Blood glucose from both phone apps (#181; the same days from each, mg/dL and mmol/L, time in ranges, meter or CGM, a year's size)
        run: python tests/test_glucose.py

      - name: Home readings from the phone apps (blood pressure, body temperature, blood oxygen; the same from both apps, once)
        run: python tests/test_receiver_vitals.py

      - name: "Cycle tracking, opt-in (#183): off keeps nothing, not even in raw/; owners only; deletion reaches every copy it can"
        run: python tests/test_cycle.py

      - name: "ECGs and irregular rhythm notifications (#182; the same events from an export and the phone, samples apart and sealed, never shared)"
        run: python tests/test_ecg.py

      - name: Respiratory rate, VO2 max and workouts' heart rate zones from the phone apps and an export (#226, #197; the same days from each, zones from age or a measured maximum)
        run: python tests/test_receiver_activity.py

      - name: Import history and undo (restores records, watch data and costs exactly; roles; raw files; by origin)
        run: python tests/test_import_history.py

      - name: "Ids that never come back (#588; a deleted profile's phone data, a stale page's edit or delete, a view after a sign-out, the upgrade to schema version 39)"
        run: python tests/test_ids.py

      - name: Corrections in the app (each edit applied, kept through re-imports, roles, encryption, corrections.json moved once)
        run: python tests/test_edits.py

      - name: "Chart activity and recategorizing (#236, #237; encounters that weren't visits as contact, visits titled by a billing code named, an entry moved to another category and the same change to similar ones at once, rules for a source's new imports, roles)"
        run: python tests/test_recategorize.py

      - name: Journal (notes, symptoms and side effects added, changed and deleted; roles; encrypted; in the records and the export)
        run: python tests/test_journal.py

      - name: "Export everything loaded elsewhere (#589; corrections, same-result decisions, the journal and its photos, doses and reminders back and undoable, by the command line and by upload; the activity log only in an owner's)"
        run: python tests/test_export.py

      - name: "Export as FHIR (#205; the same records read back over the demo and every FHIR fixture, valid against the FHIR R4 schema, stable ids, parts and cycle records as ticked)"
        run: python tests/test_fhir_export.py

      - name: Medication timeline (listings as spans with dose changes and stops, fills marked, in the records only when there are some, FHIR prescriber and RxNorm)
        run: python tests/test_medications.py

      - name: Family history (read from FHIR and C-CDA, your own entries and hiding, the visit summary, the FHIR export)
        run: python tests/test_family.py

      - name: Medication log (doses logged, corrected and removed; roles; encrypted; kept on undo; export; summary and links only when ticked; the phone's)
        run: python tests/test_med_log.py

      - name: Out-of-pocket costs (sources, receipts, HSA/FSA, matched to claims, counted once; marks, roles, encrypted)
        run: python tests/test_costs.py

      - name: Where every record came from (each record names its import, matches the history, gone on undo, merges, payload size)
        run: python tests/test_sources.py

      - name: Same result from two sources (the match rule, flagged at the preview and in the records, shown once when confirmed, undo, roles)
        run: python tests/test_crossmatch.py

      - name: Lab names matched on import (LOINC and similar-name suggestions, the choice sticks, admins edit, encrypted, hand entry)
        run: python tests/test_lab_mapping.py

      - name: Settings (every key round-trips, defaults and precedence, roles by scope, reset, settings.json moved in once, export, encryption)
        run: python tests/test_settings.py

      - name: Calendar feeds (valid iCalendar, stable UIDs, minimal details by default, rotation and revocation, bare 404s, throttling, expected labs)
        run: python tests/test_calendar.py

      - name: Visit summary PDF (every section read back with pypdf, each result against its own report's range, questions draft, roles, nothing on disk, two pages at most)
        run: python tests/test_summary.py

      - name: Share links (only the chosen sections, labs and dates; hash-only token; revoke, expiry and owner checks; bare 404s; no cookie; throttling; every view logged)
        run: python tests/test_share_links.py

      - name: Security review checks (each route's access as the review lists it, who can reach what, every column encrypted or plain on purpose, error logs without record text, no nginx access log; #203)
        run: python tests/test_security_refresh.py

      - name: Host check (#1064, DNS rebinding; with public addresses set only this server's names are answered, IP addresses and localhost always)
        run: python tests/test_host_check.py

      - name: General → Host and Phone receiver (#1000, #1003; the public and upload addresses guarded, applied at once)
        run: python tests/test_general_host.py

      - name: Milestones and workout rules (moved in once, edited, one primary, roles, encrypted; bad and catastrophic regular expressions refused)
        run: python tests/test_milestones.py

      - name: Reference ranges from settings (checks, which row fits by lab, unit, sex and age, never over a report's own range, in the visit summary)
        run: python tests/test_ranges.py

      - name: About this person (birth date, sex used for reference ranges, height history; encrypted, roles, moved in from #44's settings once, share links leave it out unless ticked; #194)
        run: python tests/test_person.py

      - name: BMI and growth charts (kg and lb, cm and feet and inches, the height of each day, the WHO's adult categories; the bundled WHO and CDC tables against published percentiles, their sources and checksums; #195, #196)
        run: python tests/test_growth.py

      - name: Dashboard presets by condition (the definitions file's LOINC codes, sources and spellings; labs matched to a profile's series, the problem list's suggestion, children; #186)
        run: python tests/test_condition_presets.py

      - name: 'The "What is this test?" links (every address https on MedlinePlus with nothing but a path, each lab once, the demo''s and the starter conditions'' labs covered; the route; #163)'
        run: python tests/test_lab_test_pages.py

      - name: Fake FHIR server for connected sources (PKCE sign-in, refresh and revocation, scopes, paging, _lastUpdated, 429/5xx, request record)
        run: python tests/test_fakefhir.py

      - name: SMART Health Links and Cards (nothing fetched before confirming, passcodes, signatures, HTTPS and public hosts only, caps)
        run: python tests/test_shl.py

      - name: Find your provider (the directory built from fictional vendor lists, search by name, place and misspelling, no network)
        run: python tests/test_directory.py

      - name: Bundled provider directory parses
        run: python -m json.tool server/directory/providers.json > /dev/null

      - name: Connected sources (sign-in and sync against the fake SMART on FHIR server)
        run: python tests/test_connections.py

      - name: Outside connections (one gateway out, unlisted hosts refused, nothing else imports the network, disconnect stops contact, the Settings view)
        run: python tests/test_outside.py

      - name: Phone app (manifest, icons and service worker served with the right types and headers; /api/ never kept)
        run: python tests/test_pwa.py

      - name: Unit preferences (exact conversions only, one table with the cross-source match, per-user setting)
        run: python tests/test_units.py

      # tests/test_importers.py (registry, every importer's fixtures, build.py output unchanged) and each importer's own
      # tests/test_importer_<name>.py: a new importer's tests run here without editing this file
      - name: Importer tests
        run: python -m unittest discover -s tests -p "test_importer*.py" -v

      - name: "Anonymising an export (tools/anonymise.py over every fixture: imports the same, no names, identifiers or original dates left; unsafe zips refused)"
        run: python tests/test_anonymise.py

      - name: Performance budgets on ten years of records (records data size and time, imports, a sync's pull, each tab's first draw; docs/performance.md)
        run: python tests/test_performance.py

  # tests/browser_check.py, a part a job (--part, each with its own app and data folder), beside the tests: the parts
  # are its PARTS, which a step of the tests job checks this list against
  browser:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60   # each part about 20 minutes on a pull request (#1029); every width (BROWSER_CHECK_FULL) about 35
    strategy:
      fail-fast: false
      matrix:
        part: [records, views, pages]
    env:
      BROWSER_CHECK_FULL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '1' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies, Playwright and Chromium
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Browser check, part ${{ matrix.part }} (sign-in, every tab, drawer, pan/zoom, profiles, account page, every page at 375 px, no errors or NaN)
        run: python tests/browser_check.py --part ${{ matrix.part }}

  # What branch protection asks for: the tests and every part of the browser check passed, or were skipped as the
  # pull request can't affect them (#1029: the browser check runs beside the tests, in parts, since it took 63 minutes)
  check:
    needs: [changes, tests, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The tests and each part of the browser check passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false

  # The install as the README describes it: build the images, start the stack, then set up and use it through nginx
  docker:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: sanguity-ci
    steps:
      - uses: actions/checkout@v7

      - name: Run the containers as this runner's user (what PUID/PGID in .env do on a real install)
        run: |
          echo "PUID=$(id -u)" >> "$GITHUB_ENV"
          echo "PGID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build and start (docker compose up -d --build)
        run: docker compose up -d --build

      - name: Wait for the app and its setup code
        run: |
          for i in $(seq 1 90); do
            code=$(docker compose logs app 2>/dev/null | grep -o 'Setup code: [A-Z0-9-]*' | tail -1 | cut -d' ' -f3)
            if [ -n "$code" ] && curl -fsS -o /dev/null http://127.0.0.1:8730/api/healthz; then
              echo "::add-mask::$code"
              echo "SETUP_CODE=$code" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "The app didn't come up with a setup code within 3 minutes"; exit 1

      - name: First run (setup, sign-in, records, documents, nothing served that shouldn't be)
        run: python3 tests/docker_smoke.py --code "$SETUP_CODE" --receiver http://127.0.0.1:8731 --phone-secret "$RUNNER_TEMP/phone-secret"

      - name: Records on disk are encrypted, and the key is kept apart from the data
        run: |
          test -s auth/data_key
          # the setup build and every file a profile keeps (settings, imported documents)
          test -n "$(find data/build data/profiles -type f ! -name '*.tmp')"
          find data/build data/profiles -type f ! -name '*.tmp' -print0 | while IFS= read -r -d '' f; do
            [ "$(head -c 4 "$f")" = SGE1 ] || { echo "$f is not encrypted"; exit 1; }
          done
          ! grep -rlq '"source"' data/build data/profiles || { echo "plaintext records found in data/"; exit 1; }
          # the records themselves are database rows (#17): none of the demo's text is readable in the database
          ls data/sanguity.db*
          ! grep -alq -e 'Lakeside Family Medicine' -e '"title"' data/sanguity.db* || { echo "plaintext records found in the database"; exit 1; }

      - name: Watch data on disk is encrypted (a signed upload, then everything in watch-data/ is sealed)
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          body = json.dumps({"source": "health_connect", "timezone": "UTC", "timestamp": "2026-11-01T09:00:00Z",
                             "weight": [{"time": "2026-11-01T08:00:00Z", "kilograms": 80.0, "uuid": "ci"}]}).encode()
          # the first profile's own secret, made by the first run's smoke test (a fresh install has no shared one, #1103)
          sig = "sha256=" + hmac.new(open(os.environ["RUNNER_TEMP"] + "/phone-secret", "rb").read().strip(), body, hashlib.sha256).hexdigest()
          r = urllib.request.Request("http://127.0.0.1:8731/ingest", data=body, headers={"X-Signature": sig})
          assert urllib.request.urlopen(r, timeout=10).status == 200
          PY
          # the first profile's own folder (watch-data/profiles/<id>/, #46), its secret being its own (#1103)
          for i in $(seq 1 30); do [ -n "$(find watch-data -name watch.db)" ] && break; sleep 1; done
          test -n "$(find watch-data -name watch.db)" && test -n "$(find watch-data -path '*/raw/*' -type f)"
          find watch-data -type f | while read -r f; do
            [ "$(head -c 4 "$f")" = SGE1 ] || { echo "$f is not encrypted"; exit 1; }
          done

      - name: After a restart (the database and records carry over)
        run: |
          docker compose up -d --force-recreate
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8730/api/healthz && break; sleep 2; done
          python3 tests/docker_smoke.py --receiver http://127.0.0.1:8731

      - name: Backup while running, lose the data, restore it
        run: |
          docker compose exec -T app python -m server.manage backup --keep 3
          f=$(ls backups | grep -E '^sanguity-backup-[0-9-]+\.tar\.gz$' | tail -1)
          docker compose exec -T app python -m server.manage verify "/backups/$f"
          docker compose stop app web
          rm -rf data/sanguity.db data/sanguity.db-* data/profiles
          docker compose run -T --rm --no-deps app python -m server.manage restore "/backups/$f" --yes
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8730/api/healthz && break; sleep 2; done
          python3 tests/docker_smoke.py --receiver http://127.0.0.1:8731

      - name: Show the containers and their logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop and remove
        if: always()
        run: docker compose down -v

  # The install templates in deploy/: each parses, uses the released image, and has the same services, folders and
  # ports as compose.release.yaml. The TrueNAS app is rendered with TrueNAS's own app library, as their CI does.
  templates:
    needs: changes
    if: needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PyYAML and Jinja2 for the system Python (Ubuntu's packages)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml python3-jinja2

      - name: TrueNAS's app library (github.com/truenas/apps, pinned; bump it with the app's lib_version)
        run: |
          git init -q /tmp/truenas-apps && cd /tmp/truenas-apps
          git remote add origin https://github.com/truenas/apps.git
          git sparse-checkout set library
          git fetch -q --depth 1 --filter=blob:none origin 4dda88572397f9e84adfa9372c91dd63601919c3
          git checkout -q FETCH_HEAD

      - name: Templates match compose.release.yaml, and the TrueNAS app renders
        run: /usr/bin/python3 -I deploy/check.py --truenas-lib /tmp/truenas-apps/library

      - name: docker compose accepts the CasaOS app (the AppStore's validator runs this too)
        run: AppID=sanguity PUID=1000 PGID=1000 TZ=UTC docker compose -f deploy/casaos/Sanguity/docker-compose.yml config --quiet

  # The published image, built the way release.yml builds it (for this runner's platform only), with no checkout
  # mounted: the four services of compose.release.yaml, then the same image as one container (docker/allinone.py,
  # what the Unraid template runs)
  release-image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: sanguity-release
      SANGUITY_IMAGE: sanguity-release
      SANGUITY_VERSION: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Folders outside the checkout, as on a released install; run as this runner's user
        run: |
          d="$RUNNER_TEMP/release"
          mkdir -p "$d"/auth "$d"/config "$d"/data "$d"/backups "$d"/watch-data "$d"/records
          { echo "PUID=$(id -u)"; echo "PGID=$(id -g)"; echo "AUTH_DIR=$d/auth"; echo "CONFIG_DIR=$d/config"
            echo "DATA_DIR=$d/data"; echo "BACKUP_DIR=$d/backups"; echo "WATCH_DIR=$d/watch-data"; echo "RECORDS_DIR=$d/records"
          } >> "$GITHUB_ENV"

      - name: Build the release image (docker/app.Dockerfile, stage "release")
        run: docker build --pull --target release --build-arg VERSION=ci -t sanguity-release:ci -f docker/app.Dockerfile .

      - name: The image holds the code and the pages, nothing from an install, and nginx's configuration is valid
        run: |
          docker run --rm sanguity-release:ci python3 -c "
          import os
          need = ['/app/docker/setup.py', '/app/docker/allinone.py', '/app/receiver.py', '/app/build.py', '/app/lab-aliases.json', '/app/condition-presets.json', '/app/lab-test-pages.json',
                  '/app/demo/generate.py', '/usr/share/nginx/html/index.html', '/etc/sanguity/nginx.d/default.conf']
          never = ['/app/auth', '/app/data', '/app/sources.json', '/usr/share/nginx/html/data.json']
          assert all(os.path.isfile(f) for f in need), [f for f in need if not os.path.isfile(f)]
          assert not any(os.path.exists(f) for f in never), [f for f in never if os.path.exists(f)]
          assert os.environ['SANGUITY_VERSION'] == 'ci'"
          docker run --rm --user 1000:1000 --read-only --tmpfs /tmp --add-host app:127.0.0.1 sanguity-release:ci nginx -t -e stderr

      - name: Start compose.release.yaml
        run: docker compose -f compose.release.yaml up -d

      - name: Wait for the app and its setup code
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:8730/api/healthz && [ -s "$DATA_DIR/setup-code.txt" ]; then
              code=$(cat "$DATA_DIR/setup-code.txt"); echo "::add-mask::$code"; echo "SETUP_CODE=$code" >> "$GITHUB_ENV"; exit 0
            fi
            sleep 2
          done
          echo "The app didn't come up with a setup code within 3 minutes"; exit 1

      - name: First run (setup, sign-in, records, documents, uploads through nginx, the receiver)
        run: python3 tests/docker_smoke.py --code "$SETUP_CODE" --receiver http://127.0.0.1:8731

      - name: Records on disk are encrypted, and the key is in its own folder
        run: |
          test -s "$AUTH_DIR/data_key" && test -s "$AUTH_DIR/watch_secret"
          test -z "$(find "$DATA_DIR" -name data_key)"
          find "$DATA_DIR/build" "$DATA_DIR/profiles" -type f ! -name '*.tmp' -print0 | while IFS= read -r -d '' f; do
            [ "$(head -c 4 "$f")" = SGE1 ] || { echo "$f is not encrypted"; exit 1; }
          done

      - name: After a restart (the database and records carry over)
        run: |
          docker compose -f compose.release.yaml up -d --force-recreate
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8730/api/healthz && break; sleep 2; done
          python3 tests/docker_smoke.py --receiver http://127.0.0.1:8731
          docker compose -f compose.release.yaml down

      - name: All in one container (read-only, as the Unraid template runs it), on fresh folders
        run: |
          d="$RUNNER_TEMP/aio"
          docker run -d --name sanguity-aio --read-only --tmpfs /tmp -p 8740:8080 -p 8741:8081 \
            -e PUID="$PUID" -e PGID="$PGID" -e TZ=Europe/London \
            -v "$d/data:/data" -v "$d/key:/run/secrets/sanguity" -v "$d/backups:/backups" -v "$d/watch:/watch" \
            -v "$d/records:/srv/records:ro" -v "$d/config:/config:ro" sanguity-release:ci
          for i in $(seq 1 90); do
            curl -fsS -o /dev/null http://127.0.0.1:8740/api/healthz && [ -s "$d/data/setup-code.txt" ] && break
            sleep 2
          done
          code=$(cat "$d/data/setup-code.txt"); echo "::add-mask::$code"
          python3 tests/docker_smoke.py --base http://127.0.0.1:8740 --code "$code" --receiver http://127.0.0.1:8741
          docker exec -u "$PUID:$PGID" sanguity-aio python3 -m server.manage list
          test -s "$d/key/data_key"
          [ "$(stat -c %u "$d/data/sanguity.db")" = "$PUID" ] || { echo "the database isn't owned by PUID"; exit 1; }

      - name: The all-in-one container stops cleanly
        run: |
          docker stop -t 30 sanguity-aio
          [ "$(docker inspect -f '{{.State.ExitCode}}' sanguity-aio)" = 0 ] || { echo "it exited with an error"; exit 1; }

      - name: Show the containers and their logs
        if: failure()
        run: |
          docker compose -f compose.release.yaml ps -a
          docker compose -f compose.release.yaml logs --no-color
          docker logs sanguity-aio || true

      - name: Stop and remove
        if: always()
        run: |
          docker compose -f compose.release.yaml down -v
          docker rm -f sanguity-aio || true

  # Upgrading from the previous release: its code (the last v* tag before this commit; until there is one, the
  # commit before records moved into the database in #103) set up on the demo data and used, then this commit
  # started on the same folders and key. The database is migrated as the app starts: its schema must reach this
  # code's version, the records must still be served, and the account made on the old version must still sign in.
  upgrade:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sanguity-upgrade
      BEFORE_RELEASES: 268e364eb313fd768d044f9d2a20dbee6e51e471   # the parent of #103: records in data.json, schema 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the tags, to find the previous release

      - name: The previous release's code beside this one, and one set of folders for both
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || echo "$BEFORE_RELEASES")
          echo "Upgrading from $prev: $(git log -1 --format='%h %s' "$prev")"
          git worktree add --detach "$RUNNER_TEMP/previous" "$prev"
          d="$RUNNER_TEMP/install"
          mkdir -p "$d"/data "$d"/backups "$d"/watch-data "$d"/records
          { echo "PUID=$(id -u)"; echo "PGID=$(id -g)"; echo "DATA_DIR=$d/data"; echo "BACKUP_DIR=$d/backups"
            echo "WATCH_DIR=$d/watch-data"; echo "RECORDS_DIR=$d/records"; } >> "$GITHUB_ENV"

      - name: The previous release, set up and used (its own smoke test), then stopped
        working-directory: ${{ runner.temp }}/previous
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do
            curl -fsS -o /dev/null http://127.0.0.1:8730/api/healthz && [ -s "$DATA_DIR/setup-code.txt" ] && break
            sleep 2
          done
          code=$(cat "$DATA_DIR/setup-code.txt"); echo "::add-mask::$code"
          python3 tests/docker_smoke.py --code "$code"
          docker compose exec -T app python3 -c "import sqlite3; print(sqlite3.connect('/data/sanguity.db').execute('PRAGMA user_version').fetchone()[0])" \
            | tr -d '\r' > "$RUNNER_TEMP/schema-before"
          echo "Schema version of the previous release: $(cat "$RUNNER_TEMP/schema-before")"
          docker compose down
          cp -a auth "$GITHUB_WORKSPACE/auth"   # its key and receiver secret, where this checkout's compose.yaml looks

      - name: This commit, started on the same folders (the database is migrated as the app starts)
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:8730/api/healthz && break; sleep 2; done

      - name: Upgraded (schema version, records moved into the database, records served, the old account signs in)
        run: |
          before=$(cat "$RUNNER_TEMP/schema-before")
          after=$(docker compose exec -T app python3 -c "import sqlite3; print(sqlite3.connect('/data/sanguity.db').execute('PRAGMA user_version').fetchone()[0])" | tr -d '\r')
          want=$(docker compose exec -T app python3 -c "from server import db; print(len(db.SCHEMA))" | tr -d '\r')
          echo "Schema version $before -> $after (this code's: $want)"
          [ "$after" = "$want" ] && [ "$after" -ge "$before" ] || { echo "the database wasn't upgraded"; exit 1; }
          if [ "$before" -lt 10 ]; then
            # each profile's data.json was loaded into the database, and neither it nor a copy of it is kept (#934)
            n=$(docker compose exec -T app python3 -c "import sqlite3; print(sqlite3.connect('/data/sanguity.db').execute('SELECT COUNT(*) FROM events').fetchone()[0])" | tr -d '\r')
            echo "Records in the database: $n"
            [ "$n" -gt 0 ] || { echo "no records were moved into the database"; exit 1; }
            left=$(docker compose exec -T app sh -c 'ls /data/profiles/*/data.json /data/profiles/*/data-before-v10.json 2>/dev/null' | tr -d '\r')
            [ -z "$left" ] || { echo "a profile's old data file was kept: $left"; exit 1; }
          fi
          if curl -fsS http://127.0.0.1:8730/api/setup | grep -q '"needed":true'; then
            echo "the upgraded install asks to be set up again"; exit 1
          fi
          python3 tests/docker_smoke.py --receiver http://127.0.0.1:8731

      - name: Show the containers and their logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop and remove
        if: always()
        run: |
          docker compose down -v
          (cd "$RUNNER_TEMP/previous" 2>/dev/null && docker compose down -v) || true
