server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # container listens on 8080 but is published on WEB_PORT

    # Session secret: auth/token.conf contains   set $ht_token "<random hex>";
    # Logins: auth/htpasswd (docker compose run --rm setup password). Restart web after changing token.conf.
    include /etc/nginx/auth/token.conf;

    # medical data: keep it out of shared caches and search engines
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # ---- public: login page, its icon, health check
    location = /login.html { }
    location = /healthz { access_log off; return 204; }

    # ---- credential check: the login form sends HTTP Basic credentials here.
    # Success serves ok.json (200) and sets the session cookie; failure -> 403 without a browser prompt.
    location = /auth {
        auth_basic "Sanguity";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        error_page 401 = @authfail;
        default_type application/json;
        add_header Set-Cookie "ht_session=$ht_token; Path=/; Max-Age=2592000; HttpOnly; SameSite=Strict";
        add_header Cache-Control "no-store" always;
        try_files /ok.json =404;
    }
    location @authfail {
        add_header Cache-Control "no-store" always;
        return 403;
    }

    location = /logout {
        add_header Set-Cookie "ht_session=deleted; Path=/; Max-Age=0; HttpOnly; SameSite=Strict";
        add_header Cache-Control "no-store" always;
        return 302 /login.html;
    }

    # ---- everything else needs a valid session cookie
    location / {
        if ($ht_token = "") { return 503; }
        if ($cookie_ht_session != $ht_token) { return 302 /login.html; }
        try_files $uri $uri/ =404;
    }

    # watch + scale summary written by the receiver (WATCH_DIR/public, mounted read-only at /srv/watch)
    location /watch/ {
        if ($ht_token = "") { return 503; }
        if ($cookie_ht_session != $ht_token) { return 302 /login.html; }
        alias /srv/watch/;
        autoindex off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # documents from the record exports (RECORDS_DIR, mounted read-only at /srv/records): same login check;
    # no scripts or plugins inside documents, PDFs stay viewable; no directory listings
    location /records/ {
        if ($ht_token = "") { return 503; }
        if ($cookie_ht_session != $ht_token) { return 302 /login.html; }
        alias /srv/records/;
        autoindex off;
        add_header Content-Security-Policy "script-src 'none'; object-src 'none'; base-uri 'none'" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
