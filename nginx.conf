# Sanguity web server. Serves the app's static pages and passes /api/ to the backend (the app service), which
# signs people in and checks their role on a profile before returning any records or documents.
# No health data is on disk where nginx can reach it: it serves only www/'s pages, styles and scripts.

# behind your own HTTPS reverse proxy, keep the scheme it saw (the app marks the session cookie Secure on HTTPS)
map $http_x_forwarded_proto $sg_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $sg_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;   # container listens on 8080 but is published on WEB_PORT
    server_tokens off;
    # no access log (#203), as in the released image (docker/nginx-main.conf) and the app itself (uvicorn's is off):
    # request lines name an upload's files (?path=), a provider search (?q=), a document's own file name and a
    # connected source's sign-in code (/connect/return?code=), which don't belong in docker's logs. Sign-ins,
    # refusals and every view of a record are in the app's security log and each profile's activity instead.
    access_log off;

    # Client addresses (sign-in throttling, the device list) come from the connection itself, never from a
    # header the client sent. Behind your own reverse proxy every visitor then shares its address; to see real
    # ones, trust that proxy here, for example:
    #   set_real_ip_from 172.16.0.0/12;   real_ip_header X-Forwarded-For;   real_ip_recursive on;

    # medical data: keep it out of shared caches and search engines; no framing, no outside resources
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    location = /healthz { access_log off; return 204; }

    # ---- the app's pages, styles and scripts (no data in them; each page asks the API who is signed in)
    location = / { try_files /index.html =404; }
    location ~ ^/(index|login|setup|account|import|settings|providers|connect|summary|admin|sources|sharing|guide)\.html$ { }
    # where a connected source's sign-in comes back (#32): a static page that posts the code to the API same-origin
    location = /connect/return { default_type text/html; alias /usr/share/nginx/html/connect-return.html; }
    # a share link's page (#47): the same headers and CSP as every page; its token is after the #, never sent here
    location = /share.html { }
    location /css/ { }
    location /js/ { }
    # ---- install as a phone app (#56): the manifest, its icons and the service worker. Same headers as the pages:
    # no-store, so the worker is checked for an update on every visit (it keeps its own copy of the pages, scripts
    # and icons itself, never of /api/). The CSP's default-src 'self' already covers worker-src and manifest-src.
    location = /manifest.webmanifest { types { } default_type application/manifest+json; }
    location = /sw.js { types { } default_type text/javascript; }
    location /icons/ { }

    # ---- API: accounts, sessions, profiles, and each profile's records and documents
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # with the port, so the app's same-origin check matches the browser's Origin
        proxy_set_header X-Forwarded-For $remote_addr;      # replaces whatever the client sent
        proxy_set_header X-Forwarded-Host $sg_host;         # the address a reverse proxy in front was reached at
        proxy_set_header X-Forwarded-Proto $sg_proto;
        proxy_set_header Connection "";
        client_max_body_size 64k;
        proxy_read_timeout 120s;
        # the app sets its own security headers (documents may be framed by the app itself); this line only
        # stops nginx adding the server-level set on top
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- a calendar feed (server/routes_calendar.py, #51): fetched by the person's own calendar app, with no
    # session, so its address carries the token. Never written to an access log (off for the whole server above,
    # and here again in case that line is changed).
    location ~ ^/api/profiles/\d+/calendar\.ics$ {
        access_log off;
        limit_except GET { deny all; }   # GET includes HEAD
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $sg_host;
        proxy_set_header X-Forwarded-Proto $sg_proto;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";      # it never needs one
        client_max_body_size 1k;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- a share link being opened (server/routes_share_links.py, #47): no session, the token is in the small JSON
    # body. Cookies are dropped (it never reads or sets one), and only POST is passed on.
    location = /api/share/view {
        limit_except POST { deny all; }
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $sg_host;
        proxy_set_header X-Forwarded-Proto $sg_proto;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        client_max_body_size 1k;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- one file of an upload from the import page (server/routes_uploads.py): the request body is the file,
    # so this is the one API request allowed to be large. Passed on as it arrives, not first saved to nginx's own
    # disk; the app streams it into the profile's folder, encrypted, and enforces UPLOAD_MAX_FILE_MB (.env), which
    # can't be raised above the cap here.
    location ~ ^/api/profiles/\d+/uploads/\d+/files$ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $sg_host;
        proxy_set_header X-Forwarded-Proto $sg_proto;
        proxy_set_header Connection "";
        client_max_body_size 4g;
        proxy_request_buffering off;
        client_body_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- a photo for a journal entry (#161, server/routes_journal.py): the request body is the picture. The app
    # refuses one over JOURNAL_PHOTO_MAX_MB (.env, 20 by default), which can't be raised above the cap here.
    location ~ ^/api/profiles/\d+/journal/photos$ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $sg_host;
        proxy_set_header X-Forwarded-Proto $sg_proto;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 120s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # anything else (old data.json, settings.json, files/, watch/ or records/ links) is not served
    location / { return 404; }
}
