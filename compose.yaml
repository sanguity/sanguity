# Sanguity.  Start:  docker compose up -d        Settings: copy .env.example to .env
# The first start prints a login (docker compose logs setup) and shows demo data until you add sources.json.
name: sanguity

services:
  # one-shot: secrets, first login, then www/data.json (your exports via sources.json, or the demo)
  setup:
    image: python:3.12-alpine
    user: "0:0"            # creates missing folders, then hands every file it writes to PUID:PGID
    restart: "no"
    command: ["python3", "-I", "/app/docker/setup.py"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./:/app:ro
      - ./www:/app/www
      - ./auth:/app/auth
      - ${WATCH_DIR:-./watch-data}:/watch
      - ${RECORDS_DIR:-./records}:/srv/records:ro

  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    user: "${PUID:-1000}:0"
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ${WATCH_DIR:-./watch-data}/public:/srv/watch:ro   # its own path: www is read-only, so nothing may mount inside it
      - ${RECORDS_DIR:-./records}:/srv/records:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./auth:/etc/nginx/auth:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Health Connect webhook receiver: the phone app posts watch and scale data here
  receiver:
    image: python:3.12-alpine
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    command: ["python3", "-I", "/app/receiver.py"]
    environment:
      DATA: /data
      SECRET_FILE: /run/secrets/sanguity/watch_secret
      TZ_DEFAULT: ${TZ:-UTC}
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "${RECEIVER_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${WATCH_DIR:-./watch-data}:/data
      - ./watch/receiver.py:/app/receiver.py:ro
      - ./auth:/run/secrets/sanguity:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
