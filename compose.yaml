# Sanguity.  Start:  docker compose up -d --build        Settings: copy .env.example to .env
# The first start prints a setup code (docker compose logs app) for creating the first account in the browser,
# and starts empty: no records until you add them (or a sources.json); setup offers a demo profile to look around.
name: sanguity

services:
  # one-shot: secrets and folders, then the built data in DATA_DIR/build (your exports via sources.json; none without one)
  setup:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: sanguity-app   # the app's image: setup encrypts the build with the app's own code
    user: "0:0"            # creates missing folders, then hands every file it writes to PUID:PGID
    restart: "no"
    command: ["python3", "-I", "/app/docker/setup.py"]
    working_dir: /app
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./:/app:ro
      - ./auth:/app/auth
      - ${DATA_DIR:-./data}:/data
      - ${BACKUP_DIR:-./backups}:/backups
      - ${WATCH_DIR:-./watch-data}:/watch
      - ${RECORDS_DIR:-./records}:/srv/records:ro

  # backend: accounts, sessions, profiles and roles; the only way to reach records and documents
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: sanguity-app
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    env_file:   # (#1158) .env as it is: what it still sets of the server's settings is taken in once, then warned about
      - path: .env
        required: false
    environment:
      SANGUITY_DATA: /data
      SANGUITY_KEY_FILE: /run/secrets/sanguity/data_key
      SANGUITY_BACKUPS: /backups
      SANGUITY_RECORDS: /srv/records
      SANGUITY_WATCH_FILE: /srv/watch/daily.json
      SANGUITY_WATCH_KEYS: /srv/watch-keys/receiver-secrets.json   # each profile's receiver secret, for the receiver (#46)
      SANGUITY_WATCH_STORE: /srv/watch-store   # the receiver's whole folder, read-only: its data goes in backups (#227)
      # (#1158) the server's settings are the page's, kept in the data folder (Settings → Install), as Sonarr's and
      # Radarr's: only the container's own are set here. .env is handed to the app as it is (env_file, above), so a
      # setting still in it is taken in once, on the first start of a version that keeps them there, and a later
      # change to it is ignored with a warning; the sign-in provider and the notification token may be kept in .env
      # on purpose (opt-in: see .env.example), and then win
      RECEIVER_PORT: ${RECEIVER_PORT:-}   # the receiver's published port (below), for the phone upload address; empty: 8731
      TZ: ${TZ:-UTC}   # the containers' clock
      SANGUITY_SAVED_SETTINGS: ${SANGUITY_SAVED_SETTINGS:-}   # off: the values saved in the app left out (#1006)
      SANGUITY_DEPLOYMENT: compose   # how it's deployed, named on Settings → General → About (#1004)
    # no ports: only nginx (web) reaches it, over the compose network
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./server:/app/server:ro
      - ./lab-aliases.json:/app/lab-aliases.json:ro   # lab names for the importers (server/importers/common.py)
      - ./condition-presets.json:/app/condition-presets.json:ro   # Settings → Dashboard's presets by condition (server/presets.py, #186)
      - ./demo/generate.py:/app/demo/generate.py:ro   # Add a demo profile (server/demo.py, #1101)
      - ./auth:/run/secrets/sanguity:ro   # data_key: the encryption key, kept apart from the data and its backups
      - ${DATA_DIR:-./data}:/data
      - ${BACKUP_DIR:-./backups}:/backups   # backups go here (Admin → Backups, or server.manage backup)
      - ${RECORDS_DIR:-./records}:/srv/records:ro
      - ${WATCH_DIR:-./watch-data}/public:/srv/watch:ro
      - ${WATCH_DIR:-./watch-data}/keys:/srv/watch-keys   # the app writes the receiver's per-profile secrets here
      - ${WATCH_DIR:-./watch-data}:/srv/watch-store:ro   # read-only: backups take its databases and uploads (#227)
      - ./www:/srv/www:ro   # only for documents of older installs kept in www/files*/ (see sources.json "files")
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/healthz',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3

  web:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    user: "${PUID:-1000}:0"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${WEB_PORT:-8730}:8080"   # this machine : container (nginx always listens on 8080 inside)
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Health Connect webhook receiver: the phone app posts watch and scale data here
  receiver:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: sanguity-app   # the app's image: the receiver encrypts WATCH_DIR with the app's own code and key
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    command: ["python3", "-I", "/app/receiver.py"]
    environment:
      DATA: /data
      SECRET_FILE: /run/secrets/sanguity/watch_secret
      SANGUITY_KEY_FILE: /run/secrets/sanguity/data_key
      TZ: ${TZ:-UTC}   # its clock; its time zone for readings is the app's to give it (#1158)
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "${RECEIVER_PORT:-8731}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${WATCH_DIR:-./watch-data}:/data
      - ./watch/receiver.py:/app/receiver.py:ro
      - ./server:/app/server:ro
      - ./auth:/run/secrets/sanguity:ro   # watch_secret (the first profile's, from before #46), and data_key (the encryption key)
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
