# Sanguity.  Start:  docker compose up -d --build        Settings: copy .env.example to .env
# The first start prints a setup code (docker compose logs app) for creating the first account in the browser,
# and shows demo data until you add sources.json.
name: sanguity

services:
  # one-shot: secrets and folders, then the built data in DATA_DIR/build (your exports via sources.json, or the demo)
  setup:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: sanguity-app   # the app's image: setup encrypts the build with the app's own code
    user: "0:0"            # creates missing folders, then hands every file it writes to PUID:PGID
    restart: "no"
    command: ["python3", "-I", "/app/docker/setup.py"]
    working_dir: /app
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./:/app:ro
      - ./auth:/app/auth
      - ${DATA_DIR:-./data}:/data
      - ${BACKUP_DIR:-./backups}:/backups
      - ${WATCH_DIR:-./watch-data}:/watch
      - ${RECORDS_DIR:-./records}:/srv/records:ro

  # backend: accounts, sessions, profiles and roles; the only way to reach records and documents
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: sanguity-app
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      SANGUITY_DATA: /data
      SANGUITY_KEY_FILE: /run/secrets/sanguity/data_key
      SANGUITY_BACKUPS: /backups
      SANGUITY_RECORDS: /srv/records
      SANGUITY_WATCH_FILE: /srv/watch/daily.json
      SESSION_DAYS: ${SESSION_DAYS:-30}
      SESSION_HOURS_WITHOUT_2FA: ${SESSION_HOURS_WITHOUT_2FA:-12}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-}
      HASH_PARALLEL: ${HASH_PARALLEL:-2}
      ACTIVITY_DAYS: ${ACTIVITY_DAYS:-365}
      REAUTH_MINUTES: ${REAUTH_MINUTES:-5}
      FORWARDED_ALLOW_IPS: "*"   # the app has no published port; only nginx reaches it, and nginx sets the header
    # no ports: only nginx (web) reaches it, over the compose network
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./server:/app/server:ro
      - ./auth:/run/secrets/sanguity:ro   # data_key: the encryption key, kept apart from the data and its backups
      - ${DATA_DIR:-./data}:/data
      - ${BACKUP_DIR:-./backups}:/backups   # server.manage backup writes here
      - ${RECORDS_DIR:-./records}:/srv/records:ro
      - ${WATCH_DIR:-./watch-data}/public:/srv/watch:ro
      - ./www:/srv/www:ro   # only for documents of older installs kept in www/files*/ (see sources.json "files")
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/healthz',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3

  web:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    user: "${PUID:-1000}:0"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${WEB_PORT:-8730}:8080"   # this machine : container (nginx always listens on 8080 inside)
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Health Connect webhook receiver: the phone app posts watch and scale data here
  receiver:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: sanguity-app   # the app's image: the receiver encrypts WATCH_DIR with the app's own code and key
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    command: ["python3", "-I", "/app/receiver.py"]
    environment:
      DATA: /data
      SECRET_FILE: /run/secrets/sanguity/watch_secret
      SANGUITY_KEY_FILE: /run/secrets/sanguity/data_key
      TZ_DEFAULT: ${TZ:-UTC}
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "${RECEIVER_PORT:-8731}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${WATCH_DIR:-./watch-data}:/data
      - ./watch/receiver.py:/app/receiver.py:ro
      - ./server:/app/server:ro
      - ./auth:/run/secrets/sanguity:ro   # watch_secret, and data_key (the encryption key)
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
