<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanguity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M5 18h6l3-8 4 13 3-7h6' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--ring:rgba(11,11,11,.12);--accent:#2a78d6;--crit:#d03b3b}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--ring:rgba(255,255,255,.12);--accent:#3987e5}}
:root[data-theme="dark"]{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--ring:rgba(255,255,255,.12);--accent:#3987e5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:28px 24px 24px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo svg{width:32px;height:32px}
h1{font-size:18px;margin:0;font-weight:650}
label{display:block;font-size:13px;color:var(--ink2);margin:14px 0 5px;font-weight:550}
input{width:100%;font:inherit;color:inherit;background:var(--page);border:1px solid var(--ring);border-radius:9px;padding:9px 11px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{width:100%;margin-top:20px;font:inherit;font-weight:650;color:#fff;background:var(--accent);border:0;border-radius:9px;padding:10px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--crit);font-size:13px;margin-top:12px;min-height:1.2em}
.note{color:var(--muted);font-size:12px;margin-top:14px}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--ring);margin-top:10px}
.or{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:14px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--ring)}
</style>
<script>try{const t=localStorage.getItem("ht-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2a78d6"/><path d="M5 18h6l3-8 4 13 3-7h6" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Sanguity</h1>
  </div>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <div id="step1">
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
  </div>
  <div id="step2" hidden>
    <div id="codeBox">
      <label for="c">Code from your authenticator app</label>
      <input id="c" name="code" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" placeholder="123 456">
      <div class="note" style="margin-top:6px">Lost your phone? Enter one of your recovery codes instead.</div>
    </div>
  </div>
  <button id="b" type="submit">Sign in</button>
  <div id="pkBox" hidden>
    <div class="or" id="pkOr">or</div>
    <button id="pk" class="alt" type="button">Sign in with a passkey</button>
  </div>
  <div class="err" id="e" role="alert"></div>
  <div class="note">Private medical records. You'll stay signed in on this device until you log out, for up to 30 days.</div>
</form>
<script src="js/util.js"></script>
<script>
const f = document.getElementById("f"), btn = document.getElementById("b"), err = document.getElementById("e");
api("setup").then(r => r.json()).then(s => { if (s.needed) location.replace("setup.html"); }).catch(() => {});
let ticket = null;   // after a correct password, when the account has two-factor sign-in on
const pkBtn = document.getElementById("pk"), pkBox = document.getElementById("pkBox");
pkBox.hidden = !passkeysWork();   // only over HTTPS (or localhost), in a browser that has them
function codeStep(on, methods = {code: true}) {
  ticket = on || null;
  const code = !on || methods.code !== false;
  document.getElementById("step1").hidden = !!on; document.getElementById("step2").hidden = !on;
  document.getElementById("codeBox").hidden = !on || !code; btn.hidden = !code;
  document.getElementById("u").readOnly = !!on; document.getElementById("p").required = !on;
  btn.textContent = on ? "Continue" : "Sign in";
  // after the password: a passkey is the other way to finish, if the account has one; before it, one signs in alone
  pkBox.hidden = !passkeysWork() || (on && !methods.passkey);
  document.getElementById("pkOr").hidden = on && !code;
  pkBtn.textContent = on ? "Use a passkey" : "Sign in with a passkey";
  if (on) (code ? document.getElementById("c") : pkBtn).focus();
}
function signedIn(j) {
  if (j.recovery_codes_left != null)   // a recovery code was used: say what that means before going on
    alert(`Signed in with a recovery code. You have ${j.recovery_codes_left} left, and every other device was signed out. ` +
          "If you lost your phone, set up two-factor sign-in again under Account.");
  location.replace(j.must_change_pw ? "account.html#password" : "./");
}
pkBtn.addEventListener("click", async () => {
  pkBtn.disabled = btn.disabled = true; err.textContent = "";
  try {
    let r = await api("login/passkey/options", {method: "POST", body: JSON.stringify({ticket})});
    let j = await r.json().catch(() => ({}));
    if (r.ok) {
      let credential;
      try { credential = await passkeyGet(j.options); } catch (e) { throw new Error(passkeyProblem(e)); }
      r = await api("login/passkey", {method: "POST", body: JSON.stringify({state: j.state, credential, ticket})});
      j = await r.json().catch(() => ({}));
      if (r.ok) { signedIn(j); return; }
    }
    err.textContent = j.detail || "Sign-in failed (" + r.status + ").";
    if (ticket && /too long. Enter your password/.test(j.detail || "")) { codeStep(null); document.getElementById("p").value = ""; }
  } catch (e) { err.textContent = e.message === "Failed to fetch" ? "Couldn't reach the server." : e.message; }
  pkBtn.disabled = btn.disabled = false;
});
f.addEventListener("submit", async ev => {
  ev.preventDefault();
  const username = document.getElementById("u").value.trim(), password = document.getElementById("p").value;
  btn.disabled = true; err.textContent = "";
  try {
    const r = ticket
      ? await api("login/code", {method: "POST", body: JSON.stringify({ticket, code: document.getElementById("c").value})})
      : await api("login", {method: "POST", body: JSON.stringify({username, password})});
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.two_factor) { codeStep(j.ticket, j.methods); btn.disabled = false; return; }
    if (r.ok) { signedIn(j); return; }
    err.textContent = j.detail || "Sign-in failed (" + r.status + ").";
    if (ticket && /too long/.test(j.detail || "")) { codeStep(null); document.getElementById("p").value = ""; }
  } catch (e) { err.textContent = "Couldn't reach the server."; }
  btn.disabled = false;
  (ticket ? document.getElementById("c") : document.getElementById("p")).select();
});
</script>
</body>
</html>
