<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanguity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3E@media (prefers-color-scheme:dark){.d{fill:%23b4485e}}%3C/style%3E%3Cpath class='d' d='M32 7C35.5 14 53 24.5 53 38.5a21 21 0 0 1-42 0C11 24.5 28.5 14 32 7Z' fill='%238a2438'/%3E%3Cpath d='M18 43.5h5.5l4.5-9 5.5 15 4-9h8' fill='none' stroke='%23fbf4f1' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--ring:rgba(11,11,11,.12);--accent:#2a78d6;--brand:#8a2438;--brand-ink:#fbf4f1;--crit:#d03b3b}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--ring:rgba(255,255,255,.12);--accent:#3987e5;--brand:#b4485e;--brand-ink:#1c1a19}}
:root[data-theme="dark"]{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--ring:rgba(255,255,255,.12);--accent:#3987e5;--brand:#b4485e;--brand-ink:#1c1a19}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:28px 24px 24px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo svg{width:28px;height:34px}
.brand-drop{fill:var(--brand)}.brand-line{stroke:var(--brand-ink)}.brand-dot{fill:var(--brand-ink)}
h1{font-size:18px;margin:0;font-weight:650}
label{display:block;font-size:13px;color:var(--ink2);margin:14px 0 5px;font-weight:550}
input{width:100%;font:inherit;color:inherit;background:var(--page);border:1px solid var(--ring);border-radius:9px;padding:9px 11px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{width:100%;margin-top:20px;font:inherit;font-weight:650;color:#fff;background:var(--accent);border:0;border-radius:9px;padding:10px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--crit);font-size:13px;margin-top:12px;min-height:1.2em}
.note{color:var(--muted);font-size:12px;margin-top:14px}
.insecure{color:var(--crit);font-size:13px;border:1px solid var(--crit);border-radius:9px;padding:8px 10px;margin:0 0 6px}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--ring);margin-top:10px}
.or{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:14px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--ring)}
</style>
<script src="js/theme.js"></script>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="logo">
    <svg class="brand" viewBox="9 5 46 56" aria-hidden="true"><path class="brand-drop" d="M32 7C35.5 14 53 24.5 53 38.5a21 21 0 0 1-42 0C11 24.5 28.5 14 32 7Z"/><path d="M23.5 24.5Q19 29.5 17.6 35.5" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="3.2" stroke-linecap="round"/><path class="brand-line" d="M19 43h5l4.5-9 5 15 4-9h6.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle class="brand-dot" cx="44" cy="40" r="3.4"/></svg>
    <h1>Sanguity</h1>
  </div>
  <p class="insecure" id="insecure" role="alert" hidden></p>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <div id="step1">
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
  </div>
  <div id="step2" hidden>
    <div id="codeBox">
      <label for="c">Code from your authenticator app</label>
      <input id="c" name="code" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" placeholder="123 456">
      <div class="note" style="margin-top:6px">Lost your phone? Enter one of your recovery codes instead.</div>
    </div>
  </div>
  <button id="b" type="submit">Sign in</button>
  <div id="pkBox" hidden>
    <div class="or" id="pkOr">or</div>
    <button id="pk" class="alt" type="button">Sign in with a passkey</button>
  </div>
  <div class="err" id="e" role="alert"></div>
  <div class="note" id="stay">Private medical records. You'll stay signed in on this device until you log out: up to 30 days
    with two-factor sign-in or a passkey, otherwise 12 hours.</div>
</form>
<script src="js/util.js"></script>
<script src="js/login.js"></script>
</body>
</html>
