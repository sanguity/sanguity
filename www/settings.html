<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanguity settings</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3E@media (prefers-color-scheme:dark){.d{fill:%23b4485e}}%3C/style%3E%3Cpath class='d' d='M32 7C35.5 14 53 24.5 53 38.5a21 21 0 0 1-42 0C11 24.5 28.5 14 32 7Z' fill='%238a2438'/%3E%3Cpath d='M18 43.5h5.5l4.5-9 5.5 15 4-9h8' fill='none' stroke='%23fbf4f1' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
</head>
<body class="acct-page">
<header>
  <h1><svg class="brand" viewBox="9 5 46 56" aria-hidden="true"><path class="brand-drop" d="M32 7C35.5 14 53 24.5 53 38.5a21 21 0 0 1-42 0C11 24.5 28.5 14 32 7Z"/><path d="M23.5 24.5Q19 29.5 17.6 35.5" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="3.2" stroke-linecap="round"/><path class="brand-line" d="M19 43h5l4.5-9 5 15 4-9h6.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle class="brand-dot" cx="44" cy="40" r="3.4"/></svg>Sanguity</h1>
  <a class="iconbtn acct" id="back" href="./">← Back to records</a>
  <span class="spacer"></span>
  <span class="meta" id="who"></span>
  <button class="iconbtn acct" id="logout" type="button">Log out</button>
</header>
<main class="acct sets">
  <div class="card warn" id="insecure" role="alert" hidden></div>

  <section class="card" id="noProfiles" hidden>
    <h2>Settings</h2>
    <p>Settings belong to a health profile, and none is shared with you yet. <a href="account.html#profiles">Create a profile</a>,
      or ask a profile's owner to share it with you.</p>
  </section>

  <section class="card" id="intro" hidden>
    <h2>Settings</h2>
    <p class="hint" id="introHint"></p>
    <div class="form inline">
      <label>Profile <select id="profile"></select></label>
    </div>
    <span class="msg" id="loadMsg" role="status"></span>
  </section>

  <div id="sections"></div>
  <datalist id="labNames"></datalist>

  <section class="card out" id="outside" aria-labelledby="outsideTitle">
    <h2 id="outsideTitle">Outside connections</h2>
    <p class="out-lead" id="outsideLead">Sanguity contacts only the hosts listed here.</p>
    <p class="hint" id="outsideScope"></p>
    <div id="outsideBody"></div>
    <span class="msg" id="outsideMsg" role="status"></span>
  </section>
</main>
<script src="js/util.js"></script>
<script src="js/settings.js"></script>
<script src="js/outside.js"></script>
</body>
</html>
