  <p class="brand-name"><svg class="brand" viewBox="9 5 46 56" aria-hidden="true"><path class="brand-drop" d="M32 7C35.5 14 53 24.5 53 38.5a21 21 0 0 1-42 0C11 24.5 28.5 14 32 7Z"/><path d="M23.5 24.5Q19 29.5 17.6 35.5" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="3.2" stroke-linecap="round"/><path class="brand-line" d="M19 43h5l4.5-9 5 15 4-9h6.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle class="brand-dot" cx="44" cy="40" r="3.4"/></svg>Sanguity</p>

<main class="acct sets">
  <div class="card warn" id="insecure" role="alert" hidden></div>

  <!-- the group shown (settings-nav.js): its title, and whose settings these are -->
  <div class="set-top" id="intro" hidden>
    <div class="set-top-hd">
      <h1 id="groupTitle">Settings</h1>
    </div>
    <p class="set-who" id="introHint"></p>
    <span class="msg" id="loadMsg" role="status"></span>
  </div>

  <!-- no profile yet: only the person's own settings are drawn (settings.js) -->
  <p class="card hint" id="noProfiles" hidden>No health profile is shared with you yet, so only your own settings are here.
    A profile's dashboard, labs and milestones appear once you have one: <a href="sharing.html#profile">create a profile</a>,
    or ask a profile's owner to share it with you.</p>

  <div id="sections"></div>

  <datalist id="labNames"></datalist>
</main>
