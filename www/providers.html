<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanguity · find your provider</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3E@media (prefers-color-scheme:dark){.d{fill:%23b4485e}}%3C/style%3E%3Cpath class='d' d='M32 7C35.5 14 53 24.5 53 38.5a21 21 0 0 1-42 0C11 24.5 28.5 14 32 7Z' fill='%238a2438'/%3E%3Cpath d='M18 43.5h5.5l4.5-9 5.5 15 4-9h8' fill='none' stroke='%23fbf4f1' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sanguity">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
</head>
<body class="acct-page">
<header class="topbar" data-title="Find your provider">
  <h1><svg class="brand" viewBox="9 5 46 56" aria-hidden="true"><path class="brand-drop" d="M32 7C35.5 14 53 24.5 53 38.5a21 21 0 0 1-42 0C11 24.5 28.5 14 32 7Z"/><path d="M23.5 24.5Q19 29.5 17.6 35.5" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="3.2" stroke-linecap="round"/><path class="brand-line" d="M19 43h5l4.5-9 5 15 4-9h6.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle class="brand-dot" cx="44" cy="40" r="3.4"/></svg>Sanguity</h1>
</header>
<main class="acct dir">
  <div class="card warn" id="insecure" role="alert" hidden></div>

  <section class="card" id="finder" hidden>
    <h2>Find your provider</h2>
    <p class="hint">Search by hospital, clinic, health system or insurer, or by city or state. The list is kept on your
      Sanguity server: searching it contacts no one.</p>
    <div class="dir-src" id="srcNote" hidden></div>
    <div class="form">
      <label>Name, city or state <input type="search" id="q" autocomplete="off" spellcheck="false" maxlength="200"
        placeholder="e.g. Mayo Clinic, Naples FL" aria-controls="results"></label>
    </div>
    <p class="msg" id="status" role="status"></p>
    <ul class="dir-results" id="results" aria-label="Providers found"></ul>
  </section>

  <section class="card" id="detail" hidden aria-live="polite"></section>
</main>
<script src="js/util.js"></script>
<script src="js/pwa.js"></script>
<script src="js/nav.js"></script>
<script src="js/providers.js"></script>
</body>
</html>
