<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up Sanguity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3E@media (prefers-color-scheme:dark){.d{fill:%23b4485e}}%3C/style%3E%3Cpath class='d' d='M32 7C35.5 14 53 24.5 53 38.5a21 21 0 0 1-42 0C11 24.5 28.5 14 32 7Z' fill='%238a2438'/%3E%3Cpath d='M18 43.5h5.5l4.5-9 5.5 15 4-9h8' fill='none' stroke='%23fbf4f1' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sanguity">
<link rel="preload" href="fonts/inter-v4.001-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);font:var(--fs-4)/1.45 var(--font-ui);padding:var(--sp-4)}
form{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--ring);border-radius:var(--r-lg);padding:var(--sp-5);box-shadow:var(--shadow-2)}
.logo{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-5)}
.logo svg{width:28px;height:34px}
.brand-drop{fill:var(--brand)}.brand-line{stroke:var(--brand-ink)}.brand-dot{fill:var(--brand-ink)}
h1{font-size:var(--fs-5);margin:0;font-weight:var(--fw-semibold)}
label{display:block;font-size:var(--fs-3);color:var(--ink2);margin:var(--sp-4) 0 var(--sp-1);font-weight:var(--fw-medium)}
input{width:100%;font:inherit;color:inherit;background:var(--page);border:1px solid var(--field-line);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3)}
button{width:100%;margin-top:var(--sp-5);font:inherit;font-weight:var(--fw-semibold);color:#fff;background:var(--accent-fill);border:0;border-radius:var(--r-md);padding:var(--sp-3);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
@media (forced-colors:active){ button{border:1px solid ButtonText} }   /* its edge, in high contrast too (#202) */
.err{color:var(--crit);font-size:var(--fs-3);margin-top:var(--sp-3);min-height:1.2em}
.note{color:var(--muted);font-size:var(--fs-3);margin-top:var(--sp-4)}   /* what to do next, at the size of the labels (#255) */
</style>
<script src="js/theme.js"></script>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="logo">
    <svg class="brand" viewBox="9 5 46 56" aria-hidden="true"><path class="brand-drop" d="M32 7C35.5 14 53 24.5 53 38.5a21 21 0 0 1-42 0C11 24.5 28.5 14 32 7Z"/><path d="M23.5 24.5Q19 29.5 17.6 35.5" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="3.2" stroke-linecap="round"/><path class="brand-line" d="M19 43h5l4.5-9 5 15 4-9h6.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle class="brand-dot" cx="44" cy="40" r="3.4"/></svg>
    <h1>Set up Sanguity</h1>
  </div>
  <div class="note" style="margin-top:0">Create the first account. It becomes the admin and owns the records already on this server.
    The setup code is in the app's log: <code>docker compose logs app</code></div>
  <label for="c">Setup code</label>
  <input id="c" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" required autofocus>
  <label for="u">Your username</label>
  <input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="new-password" required>
  <div class="note" id="pn" style="margin-top:var(--sp-2)"></div>
  <label for="p2">Repeat password</label>
  <input id="p2" type="password" autocomplete="new-password" required>
  <label for="n">Whose records are on this server? <span style="font-weight:var(--fw-regular);color:var(--muted)">(profile name, optional)</span></label>
  <input id="n" placeholder="e.g. your first name" maxlength="80">
  <button id="b" type="submit">Create account</button>
  <div class="err" id="e" role="alert"></div>
</form>
<script src="js/util.js"></script>
<script src="js/pwa.js"></script>
<script src="js/setup.js"></script>
</body>
</html>
