<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up Sanguity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3E@media (prefers-color-scheme:dark){.d{fill:%23b4485e}}%3C/style%3E%3Cpath class='d' d='M32 7C35.5 14 53 24.5 53 38.5a21 21 0 0 1-42 0C11 24.5 28.5 14 32 7Z' fill='%238a2438'/%3E%3Cpath d='M18 43.5h5.5l4.5-9 5.5 15 4-9h8' fill='none' stroke='%23fbf4f1' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sanguity">
<style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6a6964;--ring:rgba(11,11,11,.12);--accent:#2470cc;--accent-fill:#2470cc;--field-line:#8f8e89;--brand:#8a2438;--brand-ink:#fbf4f1;--crit:#d03b3b}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#9c9a94;--ring:rgba(255,255,255,.12);--accent:#4a93ec;--accent-fill:#2a6cc4;--field-line:#74736e;--crit:#e66767;--brand:#b4485e;--brand-ink:#1c1a19}}
:root[data-theme="dark"]{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#9c9a94;--ring:rgba(255,255,255,.12);--accent:#4a93ec;--accent-fill:#2a6cc4;--field-line:#74736e;--crit:#e66767;--brand:#b4485e;--brand-ink:#1c1a19}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:28px 24px 24px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo svg{width:28px;height:34px}
.brand-drop{fill:var(--brand)}.brand-line{stroke:var(--brand-ink)}.brand-dot{fill:var(--brand-ink)}
h1{font-size:18px;margin:0;font-weight:650}
label{display:block;font-size:13px;color:var(--ink2);margin:14px 0 5px;font-weight:550}
input{width:100%;font:inherit;color:inherit;background:var(--page);border:1px solid var(--field-line);border-radius:9px;padding:9px 11px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{width:100%;margin-top:20px;font:inherit;font-weight:650;color:#fff;background:var(--accent-fill);border:0;border-radius:9px;padding:10px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
@media (forced-colors:active){ button{border:1px solid ButtonText} }   /* its edge, in high contrast too (#202) */
.err{color:var(--crit);font-size:13px;margin-top:12px;min-height:1.2em}
.note{color:var(--muted);font-size:12px;margin-top:14px}
</style>
<script src="js/theme.js"></script>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="logo">
    <svg class="brand" viewBox="9 5 46 56" aria-hidden="true"><path class="brand-drop" d="M32 7C35.5 14 53 24.5 53 38.5a21 21 0 0 1-42 0C11 24.5 28.5 14 32 7Z"/><path d="M23.5 24.5Q19 29.5 17.6 35.5" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="3.2" stroke-linecap="round"/><path class="brand-line" d="M19 43h5l4.5-9 5 15 4-9h6.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle class="brand-dot" cx="44" cy="40" r="3.4"/></svg>
    <h1>Set up Sanguity</h1>
  </div>
  <div class="note" style="margin-top:0">Create the first account. It becomes the admin and owns the records already on this server.
    The setup code is in the app's log: <code>docker compose logs app</code></div>
  <label for="c">Setup code</label>
  <input id="c" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" required autofocus>
  <label for="u">Your username</label>
  <input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="new-password" required>
  <div class="note" id="pn" style="margin-top:6px"></div>
  <label for="p2">Repeat password</label>
  <input id="p2" type="password" autocomplete="new-password" required>
  <label for="n">Whose records are on this server? <span style="font-weight:400;color:var(--muted)">(profile name, optional)</span></label>
  <input id="n" placeholder="e.g. your first name" maxlength="80">
  <button id="b" type="submit">Create account</button>
  <div class="err" id="e" role="alert"></div>
</form>
<script src="js/util.js"></script>
<script src="js/pwa.js"></script>
<script src="js/setup.js"></script>
</body>
</html>
