resources:
  limits:
    cpus: 2.0
    memory: 2048

TZ: Etc/UTC

sanguity:
  public_origins: ""
  cookie_secure: auto
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8730
  receiver_port:
    bind_mode: published
    port_number: 8731
  https_port:
    bind_mode: ''
    port_number: 8443

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/data
  key: /opt/tests/mnt/key
  backups: /opt/tests/mnt/backups
  watch: /opt/tests/mnt/watch
  records: /opt/tests/mnt/records
  config: /opt/tests/mnt/config

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  key:
    type: ix_volume
    ix_volume_config:
      dataset_name: key
      create_host_path: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
  watch:
    type: ix_volume
    ix_volume_config:
      dataset_name: watch
      create_host_path: true
  records:
    type: ix_volume
    ix_volume_config:
      dataset_name: records
      create_host_path: true
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  additional_storage: []
