groups:
  - name: Sanguity Configuration
    description: Configure Sanguity
  - name: User and Group Configuration
    description: Configure User and Group for Sanguity
  - name: Network Configuration
    description: Configure Network for Sanguity
  - name: Storage Configuration
    description: Configure Storage for Sanguity
  - name: Resources Configuration
    description: Configure Resources for Sanguity
questions:
  - variable: TZ
    group: Sanguity Configuration
    label: Timezone
    description: Used to assign watch and scale readings to days.
    schema:
      type: string
      default: Etc/UTC
      required: true
      $ref:
        - definitions/timezone
  - variable: sanguity
    label: ''
    group: Sanguity Configuration
    schema:
      type: dict
      attrs:
        - variable: additional_envs
          label: Additional Environment Variables
          description: 'Optional. The server''s settings are changed in the app (Settings → Install) and kept in its data, not here: one given here is taken in once and ignored after. Only the sign-in provider (OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET...) and the notification token (NOTIFY_TOKEN) may be kept here on purpose, and then win (see .env.example in the repository).'
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string
  - variable: run_as
    label: ''
    group: User and Group Configuration
    schema:
      type: dict
      attrs:
        - variable: user
          label: User ID
          description: The user id that Sanguity files will be owned by.
          schema:
            type: int
            min: 568
            default: 568
            required: true
        - variable: group
          label: Group ID
          description: The group id that Sanguity files will be owned by.
          schema:
            type: int
            min: 568
            default: 568
            required: true
  - variable: network
    label: ''
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: 'The port bind mode.</br>

                  - Publish: The port will be published on the host for external access.</br>

                  - Expose: The port will be exposed for inter-container communication.</br>

                  - None: The port will not be exposed or published.'
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the host for external access
                    - value: exposed
                      description: Expose port for inter-container communication
                    - value: ''
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 8730
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if:
                    - - bind_mode
                      - '='
                      - published
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: receiver_port
          label: Watch Receiver Port (the phone app's uploads)
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: 'The port bind mode.</br>

                  - Publish: The port will be published on the host for external access.</br>

                  - Expose: The port will be exposed for inter-container communication.</br>

                  - None: The port will not be exposed or published.'
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the host for external access
                    - value: exposed
                      description: Expose port for inter-container communication
                    - value: ''
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 8731
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if:
                    - - bind_mode
                      - '='
                      - published
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
  - variable: storage
    label: ''
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: Sanguity Data Storage
          description: The database and each profile's files.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: 'ixVolume: Is dataset created automatically by the system.</br>

                  Host Path: Is a path that already exists on the system.'
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Host Path (Path that already exists on the system)
                    - value: ix_volume
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if:
                    - - type
                      - '='
                      - ix_volume
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: data
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - '='
                            - true
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if:
                    - - type
                      - '='
                      - host_path
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - '='
                            - true
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if:
                          - - acl_enable
                            - '='
                            - false
                        required: true
        - variable: key
          label: Sanguity Encryption Key Storage
          description: 'The encryption key and the watch receiver''s secret.</br>

            Keep it apart from the data and its backups, and keep a copy of it somewhere safe:</br>

            without it, the records can''t be read.'
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: 'ixVolume: Is dataset created automatically by the system.</br>

                  Host Path: Is a path that already exists on the system.'
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Host Path (Path that already exists on the system)
                    - value: ix_volume
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if:
                    - - type
                      - '='
                      - ix_volume
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: key
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - '='
                            - true
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if:
                    - - type
                      - '='
                      - host_path
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - '='
                            - true
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if:
                          - - acl_enable
                            - '='
                            - false
                        required: true
        - variable: backups
          label: Sanguity Backups Storage
          description: Where Sanguity writes its backups, on the schedule set under Settings > Install > Backups or with python -m server.manage backup. Copy them off this machine too.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: 'ixVolume: Is dataset created automatically by the system.</br>

                  Host Path: Is a path that already exists on the system.'
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Host Path (Path that already exists on the system)
                    - value: ix_volume
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if:
                    - - type
                      - '='
                      - ix_volume
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: backups
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - '='
                            - true
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if:
                    - - type
                      - '='
                      - host_path
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - '='
                            - true
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if:
                          - - acl_enable
                            - '='
                            - false
                        required: true
        - variable: watch
          label: Sanguity Watch Data Storage
          description: Watch and smart-scale data from the phone app.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: 'ixVolume: Is dataset created automatically by the system.</br>

                  Host Path: Is a path that already exists on the system.'
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Host Path (Path that already exists on the system)
                    - value: ix_volume
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if:
                    - - type
                      - '='
                      - ix_volume
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: watch
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - '='
                            - true
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if:
                    - - type
                      - '='
                      - host_path
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - '='
                            - true
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if:
                          - - acl_enable
                            - '='
                            - false
                        required: true
        - variable: records
          label: Sanguity Record Exports Storage
          description: Record exports read by sources.json (mounted read-only). Can stay empty.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: 'ixVolume: Is dataset created automatically by the system.</br>

                  Host Path: Is a path that already exists on the system.'
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Host Path (Path that already exists on the system)
                    - value: ix_volume
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if:
                    - - type
                      - '='
                      - ix_volume
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: records
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - '='
                            - true
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if:
                    - - type
                      - '='
                      - host_path
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - '='
                            - true
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if:
                          - - acl_enable
                            - '='
                            - false
                        required: true
        - variable: config
          label: Sanguity Config Storage
          description: sources.json, settings.json and corrections.json (mounted read-only). Can stay empty.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: 'ixVolume: Is dataset created automatically by the system.</br>

                  Host Path: Is a path that already exists on the system.'
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Host Path (Path that already exists on the system)
                    - value: ix_volume
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if:
                    - - type
                      - '='
                      - ix_volume
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: config
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - '='
                            - true
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if:
                    - - type
                      - '='
                      - host_path
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - '='
                            - true
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if:
                          - - acl_enable
                            - '='
                            - false
                        required: true
        - variable: additional_storage
          label: Additional Storage
          description: Extra mounts for the app container.
          schema:
            type: list
            default: []
            items:
              - variable: storageEntry
                label: Storage Entry
                schema:
                  type: dict
                  attrs:
                    - variable: type
                      label: Type
                      description: 'ixVolume: Is dataset created automatically by the system.</br>

                        Host Path: Is a path that already exists on the system.'
                      schema:
                        type: string
                        required: true
                        default: ix_volume
                        enum:
                          - value: host_path
                            description: Host Path (Path that already exists on the system)
                          - value: ix_volume
                            description: ixVolume (Dataset created automatically by the system)
                    - variable: read_only
                      label: Read Only
                      description: Mount the volume as read only.
                      schema:
                        type: boolean
                        default: false
                    - variable: mount_path
                      label: Mount Path
                      description: The path inside the container to mount the storage.
                      schema:
                        type: path
                        required: true
                    - variable: host_path_config
                      label: Host Path Configuration
                      schema:
                        type: dict
                        show_if:
                          - - type
                            - '='
                            - host_path
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            description: Enable ACL for the storage.
                            schema:
                              type: boolean
                              default: false
                          - variable: acl
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if:
                                - - acl_enable
                                  - '='
                                  - true
                              attrs: []
                              $ref:
                                - normalize/acl
                          - variable: path
                            label: Host Path
                            description: The host path to use for storage.
                            schema:
                              type: hostpath
                              show_if:
                                - - acl_enable
                                  - '='
                                  - false
                              required: true
                    - variable: ix_volume_config
                      label: ixVolume Configuration
                      description: The configuration for the ixVolume dataset.
                      schema:
                        type: dict
                        show_if:
                          - - type
                            - '='
                            - ix_volume
                        $ref:
                          - normalize/ix_volume
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            description: Enable ACL for the storage.
                            schema:
                              type: boolean
                              default: false
                          - variable: dataset_name
                            label: Dataset Name
                            description: The name of the dataset to use for storage.
                            schema:
                              type: string
                              required: true
                              default: storage_entry
                          - variable: acl_entries
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if:
                                - - acl_enable
                                  - '='
                                  - true
                              attrs: []
  - variable: resources
    label: ''
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for Sanguity.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for Sanguity.
                schema:
                  type: int
                  default: 2048
                  required: true
