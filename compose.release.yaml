# Sanguity from a published release: no checkout and nothing to build. All four services run the released image,
# ghcr.io/sanguity/sanguity, which holds the code, the web pages and nginx.
#
#   Start:    docker compose -f compose.release.yaml up -d          (or save this file as compose.yaml)
#   Upgrade:  set SANGUITY_VERSION in .env to the new release, then: docker compose -f compose.release.yaml pull
#             and up -d again. The database is upgraded when the app starts (see CHANGELOG.md for each release).
#
# Settings go in .env next to this file (see .env.example): SANGUITY_VERSION, ports, folders, time zone, PUID/PGID.
# compose.yaml is the other way to run Sanguity: built from a git checkout, for following main or a branch.
name: sanguity

x-image: &image ${SANGUITY_IMAGE:-ghcr.io/sanguity/sanguity}:${SANGUITY_VERSION:-latest}

services:
  # one-shot: secrets and folders, then the built data in DATA_DIR/build (your exports via sources.json; none without one)
  setup:
    image: *image
    user: "0:0"            # creates missing folders, then hands every file it writes to PUID:PGID
    restart: "no"
    command: ["python3", "-I", "/app/docker/setup.py"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${AUTH_DIR:-./auth}:/run/secrets/sanguity   # data_key and watch_secret, kept apart from the data
      - ${CONFIG_DIR:-./config}:/config:ro          # optional: sources.json, settings.json, corrections.json
      - ${DATA_DIR:-./data}:/data
      - ${BACKUP_DIR:-./backups}:/backups
      - ${WATCH_DIR:-./watch-data}:/watch
      - ${RECORDS_DIR:-./records}:/srv/records:ro

  # backend: accounts, sessions, profiles and roles; the only way to reach records and documents
  app:
    image: *image
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    command: ["python3", "-m", "server"]
    depends_on:
      setup:
        condition: service_completed_successfully
    env_file:   # (#1158) .env as it is: what it still sets of the server's settings is taken in once, then warned about
      - path: .env
        required: false
    environment:
      # (#1158) the server's settings are the page's, kept in the data folder (Settings → Install), as Sonarr's and
      # Radarr's: only the container's own are set here. .env is handed to the app as it is (env_file, above), so a
      # setting still in it is taken in once, on the first start of a version that keeps them there, and a later
      # change to it is ignored with a warning; the sign-in provider and the notification token may be kept in .env
      # on purpose (opt-in: see .env.example), and then win
      RECEIVER_PORT: ${RECEIVER_PORT:-}   # the receiver's published port (below), for the phone upload address; empty: 8731
      TZ: ${TZ:-UTC}   # the containers' clock
      SANGUITY_SAVED_SETTINGS: ${SANGUITY_SAVED_SETTINGS:-}   # off: the values saved in the app left out (#1006)
      SANGUITY_DEPLOYMENT: release   # how it's deployed, named on Settings → General → About (#1004)
    # no ports: only nginx (web) reaches it, over the compose network. Built-in HTTPS (#1159; Settings → General → Needs a
    # restart, a certificate and key in the data folder) is the app's own port 8443: to use it, uncomment these two
    # lines (HTTPS_PORT in .env picks this machine's port). Nothing listens there until a certificate is set.
    # ports:
    #   - "${HTTPS_PORT:-8443}:8443"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${AUTH_DIR:-./auth}:/run/secrets/sanguity:ro   # data_key: the encryption key, kept apart from the data and its backups
      - ${DATA_DIR:-./data}:/data
      - ${BACKUP_DIR:-./backups}:/backups   # backups go here (Admin → Backups, or server.manage backup)
      - ${RECORDS_DIR:-./records}:/srv/records:ro
      - ${WATCH_DIR:-./watch-data}:/watch:ro   # read-only: the summaries in public/, and its data for backups (#227)
      - ${WATCH_DIR:-./watch-data}/keys:/watch/keys   # the app writes the receiver's per-profile secrets here (#46)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/healthz',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3

  # nginx from the same image: the pages, and /api/ passed to the app
  web:
    image: *image
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    # nginx under the URL base the app runs with (#1159): read from the settings file, reloaded when it changes
    command: ["python3", "-I", "/app/docker/web.py"]
    depends_on:
      app:
        condition: service_started
    ports:
      - "${WEB_PORT:-8730}:8080"   # this machine : container (nginx always listens on 8080 inside)
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${DATA_DIR:-./data}:/data:ro   # only server-settings.json is read: the URL base (docker/web.py)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Health Connect webhook receiver: the phone app posts watch and scale data here
  receiver:
    image: *image
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    command: ["python3", "-I", "/app/receiver.py"]
    environment:
      DATA: /watch
      SECRET_FILE: /run/secrets/sanguity/watch_secret
      TZ: ${TZ:-UTC}   # its clock; its time zone for readings is the app's to give it (#1158)
    ports:
      - "${RECEIVER_PORT:-8731}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${WATCH_DIR:-./watch-data}:/watch
      - ${AUTH_DIR:-./auth}:/run/secrets/sanguity:ro   # watch_secret, and data_key (the encryption key)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
