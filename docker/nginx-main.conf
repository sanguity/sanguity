# nginx's main configuration in the released image (docker/app.Dockerfile, stage "release"). It runs as any
# non-root user on a read-only root filesystem: everything it writes is under /tmp. The site itself is the repo's
# nginx.conf, copied to /etc/sanguity/nginx.d/default.conf. The all-in-one container (docker/allinone.py) writes
# a copy of both to /tmp with the backend at 127.0.0.1 instead of the "app" service.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;   # the inherited stderr, not a re-opened /dev/stderr (as PUID it may not be allowed to)

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    include /etc/sanguity/nginx.d/*.conf;
}
